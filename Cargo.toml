[package]
name = "downpour"
version = "0.1.0"
edition = "2024"
description = "Terminal BitTorrent client written from scratch in Rust"
license = "MIT"

# The fuzz crate under `fuzz/` has its own workspace; keep it out of this one
# so a plain `cargo build` / `cargo test` never tries to build it.
[workspace]
exclude = ["fuzz"]

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
hex = "0.4.3"
percent-encoding = "2.3.2"
rand = "0.10.2"
ratatui = "0.30.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
sha1 = "0.11.0"
tokio = { version = "1.53.1", features = ["full"] }
